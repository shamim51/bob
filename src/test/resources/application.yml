spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: ALWAYS
  datasource:
    url: jdbc:h2:mem:bob;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.security.oauth2.server.resource.autoconfigure.servlet.OAuth2ResourceServerAutoConfiguration

bob:
  conversation-results-per-page: 25
  seed:
    enabled: false
  facebook:
    app-id: test-app-id
    app-secret: test-secret
    verify-token: test-verify
    api-version: v18.0
