server:
  port: 8080

spring:
  application:
    name: chatwoot-spring
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: ALWAYS
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/sailor}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://dev-kc.getsport360.com/realms/test_realm}

chatwoot:
  conversation-results-per-page: 25
  seed:
    enabled: ${CHATWOOT_SEED:false}

logging:
  level:
    com.chatwoot.api: INFO
