<!DOCTYPE html>
<html>
  <head>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      window.chatwootConfig = {

        helpCenterURL: '',
        fbAppId: '',
        instagramAppId: '',
        tiktokAppId: '',
        googleOAuthClientId: '',
        googleOAuthCallbackUrl: '',
        allowedLoginMethods: ['email'],
        fbApiVersion: 'v18.0',
        whatsappAppId: '',
        whatsappConfigurationId: '',
        whatsappApiVersion: '',
        signupEnabled: 'false',
        isEnterprise: 'false',
        isMfaEnabled: 'false',
        enabledLanguages: [{ name: 'English', iso_639_1_code: 'en' }],
        helpUrls: {},

        LOGOUT_REDIRECT_LINK: '/app/login',
        DISABLE_USER_PROFILE_UPDATE: false,
        APP_VERSION: '0.0.1',
        ENABLE_ACCOUNT_SIGNUP: 'false',
        IS_ENTERPRISE: false,
        ALLOWED_LOGIN_METHODS: ['email'],
      };
      window.browserConfig = { browser_name: 'Chrome' };
      window.errorLoggingConfig = '';

  </head>
  <body class="text-slate-600">
    <div id="app"></div>
    <noscript id="noscript">This app works best with JavaScript enabled.</noscript>
    <script type="module" src="/app/javascript/entrypoints/dashboard.js"></script>
  </body>
</html>
