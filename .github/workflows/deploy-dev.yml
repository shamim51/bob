name: Deploy dev

on:
  push:
    branches: [dev]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Test and package
        run: ./gradlew test bootJar --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/bob-0.1.0.jar

  image:
    needs: ci
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bob
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        run: |
          docker build -t "$IMAGE:dev" -t "$IMAGE:${GITHUB_SHA}" .
          docker push "$IMAGE:dev"
          docker push "$IMAGE:${GITHUB_SHA}"

  deploy:
    needs: image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/bob
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Restart container on EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,IMAGE,GITHUB_SHA
          script: |
            set -euo pipefail
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker pull "$IMAGE:dev"
            docker stop bob || true
            docker rm bob || true
            docker run -d --name bob --restart unless-stopped \
              --env-file /opt/bob/.env \
              -e DD_VERSION="$GITHUB_SHA" \
              -e DD_TRACE_SAMPLE_RATE=1 \
              -p 8080:8080 \
              --add-host=host.docker.internal:host-gateway \
              --label com.datadoghq.ad.logs='[{"source":"java","service":"bob"}]' \
              "$IMAGE:dev"
            docker logout
